services:
  postgres:
    image: postgres:17
    container_name: room_booking_pg
    environment:
      POSTGRES_DB: room_booking
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d room_booking"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
